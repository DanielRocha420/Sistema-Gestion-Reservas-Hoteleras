server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    loadbalancer:
      enabled: true
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: huespedes
              uri: lb://huespedes
              predicates:
                - Path=/api/huespedes/**
              filters:
                - StripPrefix=2

            - id: habitacion
              uri: lb://habitacion
              predicates:
                - Path=/api/habitacion/**
              filters:
                - StripPrefix=2

            - id: reservas
              uri: lb://reservas
              predicates:
                - Path=/api/reservas/**
              filters:

                - StripPrefix=2

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
