server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    loadbalancer:
      enabled: true
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-login
              uri: http://localhost:9000
              predicates:
                - Path=/api/auth/login
              filters:
                - RewritePath=/api/auth/login, /api/login

            - id: auth-admin
              uri: http://localhost:9000
              predicates:
                - Path=/api/auth/admin/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /${segment}

            - id: huespedes
              uri: lb://huespedes
              predicates:
                - Path=/api/huespedes/**
              filters:
                - StripPrefix=2

            - id: habitaciones
              uri: lb://habitaciones
              predicates:
                - Path=/api/habitaciones/**
              filters:
                - StripPrefix=1

            - id: reservas
              uri: lb://reserva
              predicates:
                - Path=/api/reservas/**
              filters:
                - StripPrefix=1

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/